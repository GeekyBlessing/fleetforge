version: "3.9"

# Day 1 gave this file postgres + redis. Day 6 adds prometheus + grafana
# (see deploy/prometheus.yml and deploy/grafana/) for the metrics/dashboard
# story. The scheduler and worker-agent binaries themselves still run on
# the HOST via `go run` throughout local dev -- see deploy/prometheus.yml's
# comment on why its scrape target is host.docker.internal, not a compose
# service name. A Dockerfile.scheduler for actually containerizing the
# scheduler is a later, deployment-time concern (docs/07-repository-structure.md),
# not required to develop against this stack.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleetforge
      POSTGRES_PASSWORD: fleetforge_dev_only
      POSTGRES_DB: fleetforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetforge -d fleetforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Keyspace notifications enabled for the "expired" event class used by the
    # reaper's fast-path (doc 4.2.1) -- Ex = keyevent notifications for
    # generic commands + expired events specifically.
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../internal/store/postgres/migrations:/migrations
    entrypoint:
      [
        "migrate",
        "-path", "/migrations",
        "-database", "postgres://fleetforge:fleetforge_dev_only@postgres:5432/fleetforge?sslmode=disable",
        "up"
      ]

  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      # 9091 on the host, not 9090 -- 9090 is already the scheduler's own
      # gRPC port on the host (cfg.GRPCAddr), so this avoids a collision.
      - "9091:9090"
    extra_hosts:
      # Needed on Linux hosts for host.docker.internal to resolve at all;
      # a no-op on Docker Desktop (macOS/Windows), where it already works.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:10.4.0
    depends_on:
      - prometheus
    environment:
      # Local dev only -- change before this ever runs anywhere real.
      GF_SECURITY_ADMIN_PASSWORD: fleetforge_dev_only
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  pgdata:
  promdata:
  grafanadata:
