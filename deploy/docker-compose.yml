version: "3.9"

# Day 1 scope: postgres + redis only, enough for the registration flow.
# The scheduler/worker-agent/prometheus/grafana services are added back in
# as their Dockerfiles land (Day 2 onward) -- see the commented block at the
# bottom for what's coming so the shape of the final file is visible now.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleetforge
      POSTGRES_PASSWORD: fleetforge_dev_only
      POSTGRES_DB: fleetforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetforge -d fleetforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Keyspace notifications enabled for the "expired" event class used by the
    # reaper's fast-path (doc 4.2.1) -- Ex = keyevent notifications for
    # generic commands + expired events specifically.
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../internal/store/postgres/migrations:/migrations
    entrypoint:
      [
        "migrate",
        "-path", "/migrations",
        "-database", "postgres://fleetforge:fleetforge_dev_only@postgres:5432/fleetforge?sslmode=disable",
        "up"
      ]

volumes:
  pgdata:

