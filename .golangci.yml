version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - staticcheck   # v2's staticcheck linter is a superset that now also covers what gosimple used to check separately
    - unused
    - ineffassign
    - bodyclose      # catches unclosed HTTP response bodies -- easy leak in the REST client
    - sqlclosecheck   # catches unclosed *sql.Rows / statements
    - noctx           # flags http/db calls made without context, which we rely on for cancellation everywhere
    - gocritic
  settings:
    govet:
      enable:
        - shadow   # shadowed err is a classic source of "we checked the wrong error" bugs in this codebase's nested tx blocks
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
